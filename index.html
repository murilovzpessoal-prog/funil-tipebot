const box=document.getElementById('messages'),choices=document.getElementById('choices'),bar=document.getElementById('bar'),back=document.getElementById('back');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let token=0,hist=[],cur='intro';
const toBottom=()=>requestAnimationFrame(()=>{box.scrollTop=box.scrollHeight});
const now=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

function bubble(cls){const d=document.createElement('div');d.className='bubble '+cls;box.append(d);toBottom();return d}
function rich(el,text){
  const parts=text.split(/(\*\*?[^\*\n]+?\*\*?|_[^_\n]+?_)/g);
  parts.forEach(part=>{
    if(!part)return;
    if((part.startsWith('**')&&part.endsWith('**'))||(part.startsWith('*')&&part.endsWith('*'))){
      const s=document.createElement('strong');s.textContent=part.replace(/^\*+|\*+$/g,'');el.append(s);
    }else if(part.startsWith('_')&&part.endsWith('_')){
      const em=document.createElement('em');em.textContent=part.slice(1,-1);el.append(em);
    }else{
      el.append(document.createTextNode(part));
    }
  });
}
function stamp(d){const t=document.createElement('span');t.className='time';t.textContent=now();d.append(t)}
function addText(text,user,note){
  const d=bubble(user?'user':'');const c=document.createElement('div');rich(c,text);d.append(c);
  if(note){const n=document.createElement('small');n.className='note';n.textContent=note;d.append(n)}
  stamp(d);toBottom();
}
function slot(d,label,fala){
  const s=document.createElement('div');s.className='slot';s.textContent='['+label+'] — será adicionado aqui';

  // Vídeos (segundos)
  VIDEO_01_APRESENTACAO: 24,
  VIDEO_RESULTADO_HOJE: 20,
  VIDEO_02_OPERACAO_META: 65,

function resolveMsg(m){
  return typeof m === 'function' ? m(S) : m;
}

// Motor 100% sincronizado com o término real do áudio ou vídeo (1x, 1.5x ou 2x):
// - Aguarda o usuário escutar o áudio ou assistir ao vídeo do início até o fim (em qualquer velocidade)
// - Ao terminar, aguarda ~1.3s de pausa natural antes de iniciar o envio da próxima mensagem
function waitForMediaSmart(card, msg, t){
  const mediaKey = msg.audio || msg.video;
  const nominalDur = (mediaKey && MEDIA_DURATIONS[mediaKey]) ? MEDIA_DURATIONS[mediaKey] : 15;

  return new Promise(resolve => {
    let resolved = false;
    let checkTimer = null;
    const mediaEl = card && card._mediaEl;
    const mediaEvents = ['timeupdate','ended','seeked'];

    const cleanup = () => {
      if(checkTimer){ clearInterval(checkTimer); checkTimer = null; }
      if(mediaEl){
        for(const ev of mediaEvents){
          mediaEl.removeEventListener(ev, checkEnded);
        }
      }
    };

    const finish = () => {
      if(resolved) return;
      resolved = true;
      cleanup();
      setHeaderStatus('online');
      resolve();
    };

    const isImage = !!(msg.photo || msg.prova !== undefined);
    if(isImage){
      // Tempo ideal para visualizar o print antes de encaminhar o próximo
      setTimeout(finish, 5500);
      return;
    }

    if(!mediaEl){
      setTimeout(finish, 3500);
      return;
    }

    // Fallback de segurança: caso o usuário assista até o fim sem dar play novamente ou o evento ended demore
    const maxSafetyTimeout = Math.max((nominalDur + 10) * 1000, 15000);
    const safetyTimer = setTimeout(() => {
      if(!resolved && mediaEl.currentTime > 0){
        finish();
      }
    }, maxSafetyTimeout);

    function checkEnded(){
      if(resolved) return;
      if(t !== token){
        clearTimeout(safetyTimer);
        finish();
        return;
      }
      const dur = Number.isFinite(mediaEl.duration) && mediaEl.duration > 0 ? mediaEl.duration : nominalDur;
      const curTime = mediaEl.currentTime || 0;
      if(mediaEl.ended || (dur > 0 && curTime >= dur - 0.25)){
        clearTimeout(safetyTimer);
        cleanup();
        // Espera ~1.3s após o fim real do áudio/vídeo (seja em 1x, 1.5x ou 2x) para ficar 100% natural
        setTimeout(finish, 1300);
      }
    }

    checkTimer = setInterval(checkEnded, 120);
    for(const ev of mediaEvents){
      mediaEl.addEventListener(ev, checkEnded);
    }
    mediaEl.addEventListener('error', () => {
      clearTimeout(safetyTimer);
      if(!resolved) setTimeout(finish, 3000);
    }, { once: true });
  });
}

async function play(msg, t, isLastMsg){
  msg = resolveMsg(msg);
  if(!msg)return true;
  const isText=typeof msg==='string'||!!msg.t;
  const isAudio=!!msg.audio;
  const isVideo=!!msg.video;
  const isPhoto=!!msg.photo||msg.prova!==undefined;

  // Primeiro vídeo de abertura do funil entra direto na tela, sem "digitando"
  if(cur==='intro'&&isVideo){
    clearAllTyping();
    setHeaderStatus('online');
    const card=addMedia(msg);
    toBottom();
    if(card)await waitForMediaSmart(card, msg, t);
    return t===token;
  }

  if(t!==token)return false;

  if(isAudio)setHeaderStatus('audio');
  else setHeaderStatus('digitando');

  clearAllTyping();
  const typing=bubble('typing');
  typing.innerHTML='<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  toBottom();

  let typingDelay=2000;
  if(isAudio){
    typingDelay=2300;
  }else if(isVideo){
    typingDelay=2100;
  }else if(isPhoto){
    typingDelay=1900;
  }else if(isText){
    const len=typeof msg==='string'?msg.length:(msg.t?msg.t.length:0);
    typingDelay=Math.min(Math.max(len*22,1500),2600);
  }

  await sleep(typingDelay);
  typing.remove();
  clearAllTyping();
  setHeaderStatus('online');

  if(t!==token)return false;

  let card=null;
  if(typeof msg==='string')addText(msg);
  else if(msg.t)addText(msg.t,false,msg.note);
  else card=addMedia(msg);
  toBottom();

  if(card){
    await waitForMediaSmart(card, msg, t);
  }else if(isText){
    if(isLastMsg){
      await sleep(400);
    }else{
      const len=typeof msg==='string'?msg.length:(msg.t?msg.t.length:0);
      await sleep(Math.min(Math.max(len*24,1500),2800));
    }
  }

  return t===token;
}

async function go(id,label,pre){
  const t=++token;cur=id;choices.innerHTML='';back.hidden=true;
  clearAllTyping();
  if(hintEl)hintEl.innerHTML='<span style="color:#8a9990">Aguarde para responder... ⏳</span>';
  if(label){
    addText(label,true);
    await sleep(900);
    if(t!==token)return;
  }
  const s=F[id];bar.style.width=s.p+'%';
  const allMsgs=[...(pre||[]), ...(s.msgs||[])];
  for(let i=0;i<allMsgs.length;i++){
    const m=allMsgs[i];
    const isLastMsg=(i===allMsgs.length-1);
    if(!await play(m,t,isLastMsg)){setHeaderStatus('online');return}
  }
  clearAllTyping();
  setHeaderStatus('online');
  if(t!==token)return;
  if(s.input)renderInput(s.input);
  else render(s.opts);
}
